<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fake YouTube Music (e2e)</title></head>
<body>
<!-- Mimics what Sillonette reads on music.youtube.com: navigator.mediaSession + the player's <video>. -->
<div id="movie_player" class="html5-video-player"><video class="video-stream html5-main-video"></video></div>
<ytmusic-player-bar><div class="title"></div><div class="byline"></div></ytmusic-player-bar>
<script>
  // 5 minutes of silence as a WAV blob, so that the media element really plays.
  function silentWav(seconds) {
    const rate = 8000, n = rate * seconds, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true);
    v.setUint16(34, 8, true); w(36, "data"); v.setUint32(40, n, true); new Uint8Array(buf, 44).fill(128);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  const video = document.querySelector("video");
  video.src = silentWav(300);
  window.setTrack = (title, artist, album = "Album e2e") => {
    navigator.mediaSession.metadata = new MediaMetadata({ title, artist, album,
      artwork: [{ src: "https://lh3.googleusercontent.com/e2e=w60-h60-l90-rj", sizes: "60x60" }, { src: "https://lh3.googleusercontent.com/e2e=w226-h226-l90-rj", sizes: "226x226" }] });
  };
  window.play = () => video.play();
  window.pause = () => video.pause();
  window.seek = (s) => { video.currentTime = s; };
  window.setAd = (on) => {
    document.getElementById("movie_player").classList.toggle("ad-showing", on);
    if (on) navigator.mediaSession.metadata = new MediaMetadata({ title: "Advertisement", artist: "Sponsor" });
  };
</script>
</body>
</html>
