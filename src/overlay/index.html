<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sillonette</title>
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" id="skin" href="skins/studio.css">
<script src="overlay.js" defer></script>
</head>
<body>
<div class="sillonette no-art" data-state="hidden" data-layout="h" aria-hidden="true" role="status" aria-live="polite">
  <div class="art"><img alt="" referrerpolicy="no-referrer" decoding="async"></div>
  <div class="meta">
    <div class="title" dir="auto"><span></span></div>
    <div class="line2"><span class="artist" dir="auto"></span><span class="album" dir="auto"></span><span class="status"></span></div>
    <div class="progress"><div class="bar"><div class="fill"></div></div><div class="time"><span class="cur"></span><span class="dur"></span></div></div>
  </div>
</div>
<div class="sillonette-err" hidden role="status" aria-live="polite" data-code=""><span class="code"></span><span class="msg" dir="auto"></span></div>
</body>
</html>
